<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Screen Share Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f17;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none; /* Disables default mobile pull-to-refresh & browser scrolling during pan */
      background-color: #000000;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      transform-origin: center center;
      cursor: grab;
      transition: transform 0.05s linear;
      will-change: transform;
    }

    video:active {
      cursor: grabbing;
    }

    .status-card {
      position: absolute;
      background: rgba(30, 41, 59, 0.95);
      padding: 20px 28px;
      border-radius: 12px;
      text-align: center;
      max-width: 85%;
      word-break: break-word;
      z-index: 20;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    .controls-overlay {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 30;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 12px;
      border-radius: 10px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 8px 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: #334155;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    @media (max-width: 600px) {
      .controls-overlay {
        bottom: 16px;
        right: 50%;
        transform: translateX(50%);
        width: calc(100% - 32px);
        max-width: 380px;
      }
      
      .btn {
        padding: 10px 12px;
        font-size: 0.8rem;
        flex: 1;
      }
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="viewport">
    <div id="status" class="status-card">
      <div id="statusText">Initializing viewer...</div>
      <button id="playBtn" class="btn" style="display: none; margin-top: 14px;">Tap to Play Stream</button>
    </div>

    <!-- Muted initial playback required for mobile autoplay compliance -->
    <video id="remoteVideo" autoplay playsinline muted style="display: none;"></video>

    <!-- Floating Control Bar -->
    <div id="controls" class="controls-overlay" style="display: none;">
      <button id="muteBtn" class="btn btn-secondary">🔇 Unmute</button>
      <button id="fullscreenBtn" class="btn btn-secondary">⛶ Fullscreen</button>
      <button id="zoomOut" class="btn">-</button>
      <button id="zoomReset" class="btn btn-secondary">100%</button>
      <button id="zoomIn" class="btn">+</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const playBtn = document.getElementById('playBtn');
    const videoEl = document.getElementById('remoteVideo');
    const controlsEl = document.getElementById('controls');
    const viewport = document.getElementById('viewport');
    const muteBtn = document.getElementById('muteBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Parse Host ID from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('id');

    if (!hostId) {
      statusText.innerText = 'Error: Missing Host ID in URL parameters.';
    } else {
      // Configure STUN servers for cross-network NAT/firewall traversal
      const peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        statusText.innerText = 'Connecting to host stream...';
        
        // Generate a 1px offscreen video track to ensure proper WebRTC SDP m=video negotiation
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = 1;
        const dummyStream = canvas.captureStream(1);

        const call = peer.call(hostId, dummyStream);

        if (!call) {
          statusText.innerText = 'Failed to reach host ID.';
          return;
        }

        call.on('stream', (remoteStream) => {
          statusText.innerText = 'Stream received! Loading video...';
          videoEl.srcObject = remoteStream;

          videoEl.onloadedmetadata = () => {
            videoEl.play().then(() => {
              statusEl.style.display = 'none';
              videoEl.style.display = 'block';
              controlsEl.style.display = 'flex';
            }).catch(err => {
              console.warn('Autoplay prevented:', err);
              statusText.innerText = 'Stream ready! Tap below to start playing:';
              playBtn.style.display = 'inline-block';
            });
          };
        });

        playBtn.addEventListener('click', () => {
          videoEl.play();
          statusEl.style.display = 'none';
          videoEl.style.display = 'block';
          controlsEl.style.display = 'flex';
        });

        call.on('close', () => {
          statusEl.style.display = 'block';
          videoEl.style.display = 'none';
          controlsEl.style.display = 'none';
          statusText.innerText = 'Stream session ended by host.';
        });

        peer.on('error', (err) => {
          statusText.innerText = `Connection error: ${err.type || err}`;
        });
      });
    }

    let scale = 1;
    let pointX = 0, pointY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let initialPinchDistance = null;

    function applyTransform() {
      const maxScale = 5;
      const minScale = 1;
      scale = Math.min(Math.max(minScale, scale), maxScale);

      if (scale === 1) {
        pointX = 0;
        pointY = 0;
      }

      videoEl.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      document.getElementById('zoomReset').innerText = `${Math.round(scale * 100)}%`;
    }

    // 1. Mouse Wheel Zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      scale *= zoomFactor;
      applyTransform();
    }, { passive: false });

    // 2. Drag Pan Logic
    function startPan(e) {
      if (scale <= 1) return;
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startX = clientX - pointX;
      startY = clientY - pointY;
    }

    function movePan(e) {
      if (!isDragging || scale <= 1) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointX = clientX - startX;
      pointY = clientY - startY;
      applyTransform();
    }

    function stopPan() {
      isDragging = false;
    }

    viewport.addEventListener('mousedown', startPan);
    window.addEventListener('mousemove', movePan);
    window.addEventListener('mouseup', stopPan);

    // 3. Mobile Touch Pinch-to-Zoom & Pan
    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      } else if (e.touches.length === 1) {
        startPan(e);
      }
    });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialPinchDistance;
        scale *= factor > 1 ? 1.03 : 0.97;
        initialPinchDistance = currentDistance;
        applyTransform();
      } else if (e.touches.length === 1) {
        movePan(e);
      }
    });

    viewport.addEventListener('touchend', () => {
      stopPan();
      initialPinchDistance = null;
    });

    // Audio Toggle Handler
    muteBtn.addEventListener('click', () => {
      videoEl.muted = !videoEl.muted;
      if (videoEl.muted) {
        muteBtn.innerText = '🔇 Unmute';
        muteBtn.classList.add('btn-secondary');
      } else {
        muteBtn.innerText = '🔊 Mute';
        muteBtn.classList.remove('btn-secondary');
      }
    });

    // Fullscreen Toggle Handler (with Safari/iOS fallback)
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (viewport.requestFullscreen) {
          viewport.requestFullscreen();
        } else if (videoEl.webkitEnterFullscreen) {
          videoEl.webkitEnterFullscreen(); // iOS Safari native video player fallback
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    });

    // Update Fullscreen Button text dynamically
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fullscreenBtn.innerText = '⛶ Exit Fullscreen';
      } else {
        fullscreenBtn.innerText = '⛶ Fullscreen';
      }
    });

    // Zoom Buttons
    document.getElementById('zoomIn').addEventListener('click', () => {
      scale *= 1.25;
      applyTransform();
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      scale /= 1.25;
      applyTransform();
    });

    document.getElementById('zoomReset').addEventListener('click', () => {
      scale = 1;
      pointX = 0;
      pointY = 0;
      applyTransform();
    });
  </script>
</body>
</html>
