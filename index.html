<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Share Viewer</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    .status-card {
      background: #1e293b;
      padding: 16px 24px;
      border-radius: 8px;
      text-align: center;
      max-width: 80%;
      word-break: break-word;
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="status" class="status-card">Initializing viewer...</div>
  <video id="remoteVideo" autoplay playsinline muted controls style="display: none;"></video>

  <script>
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('remoteVideo');

    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('id');

    if (!hostId) {
      statusEl.innerText = 'Error: Missing Host ID in URL parameters.';
    } else {
      const peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        statusEl.innerText = 'Connecting to host stream...';
        
        // Pass a dummy MediaStream so PeerJS initializes the connection correctly
        const emptyStream = new MediaStream();
        const call = peer.call(hostId, emptyStream);

        if (!call) {
          statusEl.innerText = 'Failed to reach host ID.';
          return;
        }

        call.on('stream', (remoteStream) => {
          statusEl.style.display = 'none';
          videoEl.style.display = 'block';
          videoEl.srcObject = remoteStream;
          
          videoEl.play().catch(err => {
            console.warn('Autoplay error:', err);
          });
        });

        call.on('close', () => {
          statusEl.style.display = 'block';
          videoEl.style.display = 'none';
          statusEl.innerText = 'Stream session ended by host.';
        });

        peer.on('error', (err) => {
          statusEl.innerText = `Connection error: ${err.type || err}`;
        });
      });
    }
  </script>
</body>
</html>
