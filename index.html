<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Share Viewer</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    .status-card {
      background: #1e293b;
      padding: 16px 24px;
      border-radius: 8px;
      text-align: center;
      max-width: 80%;
      word-break: break-word;
    }
    button {
      margin-top: 12px;
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="status" class="status-card">
    <div id="statusText">Initializing viewer...</div>
    <button id="playBtn" style="display: none;">Tap to Play Stream</button>
  </div>

  <video id="remoteVideo" autoplay playsinline muted controls style="display: none;"></video>

  <script>
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const playBtn = document.getElementById('playBtn');
    const videoEl = document.getElementById('remoteVideo');

    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('id');

    if (!hostId) {
      statusText.innerText = 'Error: Missing Host ID in URL parameters.';
    } else {
      const peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        statusText.innerText = 'Connecting to host stream...';
        
        // Create a 1px dummy video track so WebRTC SDP creates the 'm=video' media section
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = 1;
        const dummyStream = canvas.captureStream(1);

        const call = peer.call(hostId, dummyStream);

        if (!call) {
          statusText.innerText = 'Failed to reach host ID.';
          return;
        }

        call.on('stream', (remoteStream) => {
          statusText.innerText = 'Stream received! Loading video...';
          videoEl.srcObject = remoteStream;

          videoEl.onloadedmetadata = () => {
            videoEl.play().then(() => {
              statusEl.style.display = 'none';
              videoEl.style.display = 'block';
            }).catch(err => {
              console.warn('Autoplay prevented:', err);
              statusText.innerText = 'Stream ready! Click below to start playing:';
              playBtn.style.display = 'inline-block';
            });
          };
        });

        playBtn.addEventListener('click', () => {
          videoEl.play();
          statusEl.style.display = 'none';
          videoEl.style.display = 'block';
        });

        call.on('close', () => {
          statusEl.style.display = 'block';
          videoEl.style.display = 'none';
          playBtn.style.display = 'none';
          statusText.innerText = 'Stream session ended by host.';
        });

        peer.on('error', (err) => {
          statusText.innerText = `Connection error: ${err.type || err}`;
        });
      });
    }
  </script>
</body>
</html>
